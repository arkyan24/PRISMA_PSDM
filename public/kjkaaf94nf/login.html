<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>PRISMA — Masuk Konsol Pemilik Sistem</title>
  <link rel="icon" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      padding: 20px;
      margin: 0;
      position: relative;
      transition: background var(--transition), color var(--transition);
    }

    /* Floating Theme Toggle matching PRISMA */
    .theme-floating-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .theme-floating-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .owner-login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 38px 32px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      position: relative;
      animation: cardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .owner-logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand-logo-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .brand-logo-wrap img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .brand-text-col {
      text-align: left;
    }

    .brand-main-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--text);
    }

    .brand-sub-title {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .owner-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.28);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .owner-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .owner-title {
      font-size: 1.38rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 6px 0;
    }

    .owner-sub {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin: 0 0 24px 0;
      line-height: 1.45;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-input-owner {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .form-input-owner:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-owner-login {
      width: 100%;
      height: 46px;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: all 0.2s ease;
      margin-top: 20px;
    }

    .btn-owner-login:hover {
      opacity: 0.94;
      transform: translateY(-1px);
      box-shadow: 0 6px 22px var(--accent-glow);
    }

    .alert-owner {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      margin-bottom: 18px;
      display: none;
      text-align: left;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Floating Theme Toggle -->
  <button type="button" class="theme-floating-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Mode Tampilan" aria-label="Beralih Mode Gelap/Terang">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <div class="owner-login-card">
    
    <div class="owner-logo-row">
      <div class="brand-logo-wrap">
        <img src="/images/logo.png" alt="Logo PRISMA">
      </div>
      <div class="brand-text-col">
        <div class="brand-main-title">PRISMA</div>
        <div class="brand-sub-title">PR Intelligence & Social Media</div>
      </div>
    </div>

    <div class="owner-badge">
      <span class="dot"></span>
      <span>Konsol Master Owner</span>
    </div>

    <h1 class="owner-title">Autentikasi Pemilik Sistem</h1>
    <p class="owner-sub">Hanya pemilik sah yang diizinkan mengakses konsol persetujuan pendaftaran dan kontrol pengguna.</p>

    <div class="alert-owner" id="alertOwner">
      <span id="alertOwnerMsg">Kredensial master tidak valid.</span>
    </div>

    <form onsubmit="handleOwnerLogin(event)">
      <div class="form-group">
        <label class="form-label" for="ownerUsername">Username Master</label>
        <input type="text" id="ownerUsername" class="form-input-owner" placeholder="owner.syiar" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="ownerPassword">Kata Sandi Master</label>
        <input type="password" id="ownerPassword" class="form-input-owner" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn-owner-login" id="btnOwnerSubmit">
        <span id="btnOwnerText">Masuk ke Konsol Pemilik</span>
      </button>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script>
    async function handleOwnerLogin(e) {
      e.preventDefault();
      const u = document.getElementById('ownerUsername').value.trim();
      const p = document.getElementById('ownerPassword').value;
      const alertBox = document.getElementById('alertOwner');
      const alertMsg = document.getElementById('alertOwnerMsg');
      const btn = document.getElementById('btnOwnerSubmit');
      const btnText = document.getElementById('btnOwnerText');

      alertBox.style.display = 'none';
      btn.disabled = true;
      btnText.textContent = 'Memverifikasi Akses...';

      try {
        const res = await fetch('/kjkaaf94nf/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          btnText.textContent = 'Akses Diterima! Mengalihkan...';
          setTimeout(() => {
            window.location.href = '/kjkaaf94nf/';
          }, 500);
        } else {
          alertMsg.textContent = data.message || 'Username atau kata sandi master salah.';
          alertBox.style.display = 'block';
          btn.disabled = false;
          btnText.textContent = 'Masuk ke Konsol Pemilik';
        }
      } catch (err) {
        console.error(err);
        alertMsg.textContent = 'Koneksi ke server gagal.';
        alertBox.style.display = 'block';
        btn.disabled = false;
        btnText.textContent = 'Masuk ke Konsol Pemilik';
      }
    }
  </script>
</body>
</html>
